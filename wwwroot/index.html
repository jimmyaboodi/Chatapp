<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatt</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #messages { border: 1px solid #ccc; border-radius: 6px; height: 350px; overflow-y: auto; padding: .5rem; margin: .5rem 0; }
    .system { color: #888; font-style: italic; }
    .row { display: flex; gap: .5rem; }
    input { flex: 1; padding: .5rem; }
    button { padding: .5rem 1rem; }
    #error { color: #b00020; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Chatt</h1>

  <!-- Steg 1: välj användarnamn -->
  <div id="login">
    <div class="row">
      <input id="username" placeholder="Välj användarnamn" maxlength="20" />
      <button id="joinBtn">Gå med</button>
    </div>
  </div>

  <!-- Steg 2: chatta -->
  <div id="chat" hidden>
    <div><strong>Online:</strong> <span id="users"></span></div>
    <div id="messages"></div>
    <div class="row">
      <input id="message" placeholder="Skriv ett meddelande..." maxlength="500" />
      <button id="sendBtn">Skicka</button>
    </div>
  </div>
  <div id="error"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script>
    // Bygger anslutningen. SignalR väljer själv WebSockets och faller tillbaka
    // på Server-Sent Events / Long Polling om WebSockets inte fungerar.
    const connection = new signalR.HubConnectionBuilder()
      .withUrl("/chat")
      .withAutomaticReconnect()
      .build();

    const $ = (id) => document.getElementById(id);
    const showError = (text) => { $("error").textContent = text || ""; };

    // Visar text i meddelanderutan. textContent (inte innerHTML) förhindrar XSS:
    // om någon skickar <script> visas det bara som text.
    function addLine(text, cssClass) {
      const div = document.createElement("div");
      if (cssClass) div.className = cssClass;
      div.textContent = text;
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    // Händelser som servern skickar till klienten
    connection.on("ReceiveMessage", (user, message, time) => addLine(`[${time}] ${user}: ${message}`));
    connection.on("SystemMessage", (text) => addLine(text, "system"));
    connection.on("UserList", (users) => { $("users").textContent = users.join(", "); });
    connection.onreconnecting(() => showError("Tappade anslutningen, försöker återansluta..."));
    connection.onreconnected(() => { showError("Återansluten. Gå med igen."); location.reload(); });
    connection.onclose(() => showError("Anslutningen stängdes."));

    async function join() {
      showError("");
      try {
        if (connection.state === signalR.HubConnectionState.Disconnected) {
          await connection.start();
        }
        const error = await connection.invoke("Join", $("username").value);
        if (error) { showError(error); return; }
        $("login").hidden = true;
        $("chat").hidden = false;
        $("message").focus();
      } catch (e) {
        showError("Kunde inte ansluta till servern.");
      }
    }

    async function send() {
      const text = $("message").value;
      if (!text.trim()) return;
      try {
        await connection.invoke("SendMessage", text);
        $("message").value = "";
      } catch (e) {
        showError("Kunde inte skicka meddelandet.");
      }
    }

    $("joinBtn").addEventListener("click", join);
    $("username").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
    $("sendBtn").addEventListener("click", send);
    $("message").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
